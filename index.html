<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Archivio Zadirs3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; background: #f8f9fa; color: #202124; }
    .app-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100%; }
    .sticky-top { flex-shrink: 0; background: #fff; padding: 10px 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); border-bottom: 1px solid #e0e0e0; z-index: 1000; }
    .search-box { display: flex; gap: 6px; align-items: center; }
    input[type="text"] { flex: 1; min-width: 0; padding: 9px 14px; font-size: 16px; border: 1px solid #dadce0; border-radius: 24px; outline: none; background: #f1f3f4; }
    input[type="text"]:focus { background: #fff; border-color: #1a73e8; }
    .nav-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    button { padding: 8px 14px; border: none; border-radius: 20px; background: #1a73e8; color: #fff; font-weight: 500; cursor: pointer; font-size: 14px; white-space: nowrap; flex-shrink: 0; }
    button.secondary { background: #e8eaed; color: #3c4043; }
    button.back-btn { background: #fce8e6; color: #c5221f; font-weight: 600; }
    .breadcrumb { font-size: 14px; font-weight: 600; color: #3c4043; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main-container { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 60px; }
    .section-title { font-size: 12px; font-weight: 600; color: #5f6368; text-transform: uppercase; margin: 12px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; color: inherit; }
    .folder-card { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; font-size: 14px; cursor: pointer; }
    .folder-card:hover { background: #f1f3f4; border-color: #c6dafc; }
    .card-link { text-decoration: none; color: inherit; display: block; }
    .thumb { width: 100%; height: 115px; object-fit: cover; border-radius: 6px; background: #f1f3f4; margin-bottom: 6px; display: block; }
    .icon-box { width: 100%; height: 115px; display: flex; align-items: center; justify-content: center; font-size: 32px; background: #f1f3f4; border-radius: 6px; margin-bottom: 6px; color: #5f6368; }
    .file-name { font-size: 12px; word-break: break-word; line-height: 1.3; font-weight: 500; }
    .folder-badge { font-size: 11px; color: #5f6368; margin-top: 3px; }
    .price-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
    .price-badge { background: #e6f4ea; color: #137333; font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 12px; display: inline-block; }
    .contact-btn { background: #25D366; color: #fff; text-decoration: none; font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 12px; display: inline-block; }
    .contact-btn.ig { background: #E1306C; }
    #loader { text-align: center; padding: 40px; font-size: 15px; color: #5f6368; }
    .load-more-wrap { text-align: center; margin: 24px 0; }
    .error-msg { background: #fce8e6; color: #c5221f; padding: 14px; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="sticky-top">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cerca file o cartelle..." onkeyup="if(event.key==='Enter') doSearch()">
        <button onclick="doSearch()">Cerca</button>
      </div>
      <div class="nav-bar">
        <button id="backBtn" class="back-btn" onclick="goBack()" style="display:none;">⬅ Indietro</button>
        <button class="secondary" onclick="resetHome()">🏠 Home</button>
        <div class="breadcrumb" id="breadcrumb">Archivio</div>
      </div>
    </div>
    <div class="main-container" id="scrollArea" onscroll="checkScrollBottom()">
      <div id="loader">Caricamento archivio in corso...</div>
      <div id="content"></div>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyAPXsZ_4j_Rw6Hvqr4bIFBh3I2MBM58QQY";
    const ROOT_FOLDER_ID = "1VyWi4w4gXem0EzG1AbJ12-dmuykrQMUZ";
    const INSTAGRAM_URL = "https://www.instagram.com/zadiris3d/";

    let historyStack = [];
    let folderCache = {};
    let folderNameCache = {};
    let fullArchiveIndex = null;
    let isSearching = false;
    let currentFileList = [];
    let renderedCount = 0;
    const BATCH_SIZE = 60;

    window.onload = function() {
      loadFolder(ROOT_FOLDER_ID, true);
    };

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function parseNameAndPrice(rawName) {
      if (!rawName) return { cleanName: "", price: "" };
      let cleanName = String(rawName);
      let price = "";
      const bracketMatch = cleanName.match(/\[([^\]]+)\]/);
      if (bracketMatch) {
        price = bracketMatch[1].trim();
        cleanName = cleanName.replace(bracketMatch[0], "").replace(/\s{2,}/g, " ").trim();
      } else {
        const parenMatch = cleanName.match(/\(([^)]*€[^)]*)\)/);
        if (parenMatch) {
          price = parenMatch[1].trim();
          cleanName = cleanName.replace(parenMatch[0], "").replace(/\s{2,}/g, " ").trim();
        }
      }
      if (price && price.indexOf("€") === -1 && /\d/.test(price)) {
        price = price + " €";
      }
      return { cleanName: cleanName, price: price };
    }

    function scrollToTop() {
      const area = document.getElementById("scrollArea");
      if (area) area.scrollTop = 0;
    }

    function updateBackButton() {
      const btn = document.getElementById("backBtn");
      if (btn) {
        btn.style.display = (isSearching || historyStack.length > 1) ? "inline-block" : "none";
      }
    }

    async function fetchDrive(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Errore API (" + res.status + ")");
      return await res.json();
    }

    async function getFolderName(id) {
      if (folderNameCache[id]) return folderNameCache[id];
      try {
        const data = await fetchDrive("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) + "?fields=name&key=" + encodeURIComponent(API_KEY));
        folderNameCache[id] = data.name || "Archivio";
      } catch (e) {
        folderNameCache[id] = "Archivio";
      }
      return folderNameCache[id];
    }

    async function loadFolder(folderId, pushHistory) {
      isSearching = false;
      scrollToTop();
      document.getElementById("loader").style.display = "block";
      document.getElementById("content").innerHTML = "";

      try {
        if (folderCache[folderId]) {
          if (pushHistory) historyStack.push(folderId);
          renderFolder(folderCache[folderId]);
          return;
        }

        const folderName = await getFolderName(folderId);
        let folders = [];
        let files = [];
        let pageToken = "";

        do {
          const q = encodeURIComponent("'" + folderId + "' in parents and trashed = false");
          const fields = encodeURIComponent("nextPageToken, files(id, name, mimeType, webViewLink, thumbnailLink)");
          const url = "https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=" + fields + "&pageSize=1000&orderBy=folder,name&key=" + encodeURIComponent(API_KEY) + (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");
          const data = await fetchDrive(url);

          (data.files || []).forEach(function(item) {
            const mime = item.mimeType || "";
            if (mime === "application/vnd.google-apps.folder") {
              folderNameCache[item.id] = item.name;
              folders.push({ id: item.id, name: item.name });
            } else {
              const parsed = parseNameAndPrice(item.name);
              files.push({
                id: item.id,
                rawName: item.name || "",
                name: parsed.cleanName,
                price: parsed.price,
                url: item.webViewLink || ("https://drive.google.com/file/d/" + item.id + "/view"),
                isImage: mime.indexOf("image/") === 0,
                thumb: item.thumbnailLink ? item.thumbnailLink.replace("=s220", "=s400") : ("https://lh3.googleusercontent.com/d/" + item.id + "=w400")
              });
            }
          });
          pageToken = data.nextPageToken || "";
        } while (pageToken);

        const result = { folderId: folderId, folderName: folderName, folders: folders, files: files };
        folderCache[folderId] = result;
        if (pushHistory) historyStack.push(folderId);
        renderFolder(result);

      } catch (err) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("content").innerHTML = '<div class="error-msg">Errore nel caricamento: ' + escapeHtml(err.message) + '</div>';
      }
    }

    function goBack() {
      if (isSearching) {
        isSearching = false;
        document.getElementById("searchInput").value = "";
        const currentId = historyStack.length > 0 ? historyStack[historyStack.length - 1] : ROOT_FOLDER_ID;
        loadFolder(currentId, false);
        return;
      }
      if (historyStack.length > 1) {
        historyStack.pop();
        const prevId = historyStack[historyStack.length - 1];
        loadFolder(prevId, false);
      }
    }

    function resetHome() {
      isSearching = false;
      document.getElementById("searchInput").value = "";
      historyStack = [];
      loadFolder(ROOT_FOLDER_ID, true);
    }

    function renderFolder(data) {
      document.getElementById("loader").style.display = "none";
      updateBackButton();
      document.getElementById("breadcrumb").textContent = "📂 " + data.folderName;

      let html = "";
      if (data.folders.length > 0) {
        html += '<div class="section-title">Cartelle (' + data.folders.length + ')</div><div class="grid">';
        data.folders.forEach(function(f) {
          html += '<div class="card folder-card" data-fid="' + escapeHtml(f.id) + '" onclick="loadFolder(this.dataset.fid, true)">📁 <span>' + escapeHtml(f.name) + '</span></div>';
        });
        html += '</div>';
      }

      if (data.files.length > 0) {
        html += '<div class="section-title">File (' + data.files.length + ')</div><div class="grid" id="filesGrid"></div>';
        html += '<div class="load-more-wrap" id="loadMoreWrap"></div>';
      }

      if (data.folders.length === 0 && data.files.length === 0) {
        html = '<p>Questa cartella è vuota.</p>';
      }

      document.getElementById("content").innerHTML = html;
      currentFileList = data.files || [];
      renderedCount = 0;
      if (currentFileList.length > 0) appendMoreFiles();
    }

    function buildContactHtml(cleanName, price) {
      if (!price) return "";
      let btnHtml = "";
      const waClean = String(WHATSAPP_NUMBER || "").replace(/\D/g, "");
      if (waClean) {
        const msg = encodeURIComponent("Ciao! Vorrei informazioni per questo articolo: " + cleanName + " (" + price + ")");
        btnHtml = '<a class="contact-btn" href="https://wa.me/' + waClean + '?text=' + msg + '" target="_blank" rel="noopener">💬 Richiedi</a>';
      } else if (INSTAGRAM_URL) {
        btnHtml = '<a class="contact-btn ig" href="' + escapeHtml(INSTAGRAM_URL) + '" target="_blank" rel="noopener">📩 Contatta</a>';
      }
      return '<div class="price-row"><span class="price-badge">🏷️ ' + escapeHtml(price) + '</span>' + btnHtml + '</div>';
    }

    function appendMoreFiles() {
      const grid = document.getElementById("filesGrid");
      if (!grid || renderedCount >= currentFileList.length) return;

      const nextBatch = currentFileList.slice(renderedCount, renderedCount + BATCH_SIZE);
      let chunkHtml = "";
      nextBatch.forEach(function(file) {
        const safeUrl = escapeHtml(file.url);
        const safeThumb = escapeHtml(file.thumb);
        const safeName = escapeHtml(file.name);
        const preview = file.isImage
          ? '<img class="thumb" src="' + safeThumb + '" loading="lazy" onerror="this.onerror=null;this.src=\'https://lh3.googleusercontent.com/d/' + encodeURIComponent(file.id) + '=w400\';">'
          : '<div class="icon-box">📄</div>';
        const badge = file.folder ? '<div class="folder-badge">in: ' + escapeHtml(file.folder) + '</div>' : '';
        const priceBlock = buildContactHtml(file.name, file.price);

        chunkHtml += '<div class="card">'
          + '<a class="card-link" href="' + safeUrl + '" target="_blank" rel="noopener">' + preview + '<div class="file-name">' + safeName + '</div>' + badge + '</a>'
          + priceBlock
          + '</div>';
      });

      grid.insertAdjacentHTML("beforeend", chunkHtml);
      renderedCount += nextBatch.length;

      const wrap = document.getElementById("loadMoreWrap");
      if (wrap) {
        if (renderedCount < currentFileList.length) {
          const rimanenti = currentFileList.length - renderedCount;
          wrap.innerHTML = '<button class="secondary" onclick="appendMoreFiles()">Carica altre (' + rimanenti + ' rimanenti)</button>';
        } else {
          wrap.innerHTML = '';
        }
      }
    }

    function checkScrollBottom() {
      const area = document.getElementById("scrollArea");
      if (area && (area.scrollTop + area.clientHeight >= area.scrollHeight - 250)) {
        appendMoreFiles();
      }
    }

    async function buildFullIndex() {
      if (fullArchiveIndex) return fullArchiveIndex;
      let allItems = [];
      let queue = [{ id: ROOT_FOLDER_ID, name: await getFolderName(ROOT_FOLDER_ID) }];

      while (queue.length > 0) {
        const current = queue.shift();
        let pageToken = "";
        do {
          const q = encodeURIComponent("'" + current.id + "' in parents and trashed = false");
          const fields = encodeURIComponent("nextPageToken, files(id, name, mimeType, webViewLink, thumbnailLink)");
          const url = "https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=" + fields + "&pageSize=1000&key=" + encodeURIComponent(API_KEY) + (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");
          const data = await fetchDrive(url);

          (data.files || []).forEach(function(item) {
            const mime = item.mimeType || "";
            const isFolder = mime === "application/vnd.google-apps.folder";
            if (isFolder) {
              folderNameCache[item.id] = item.name;
              queue.push({ id: item.id, name: item.name });
            }
            const parsed = isFolder ? { cleanName: item.name, price: "" } : parseNameAndPrice(item.name);
            allItems.push({
              id: item.id,
              rawName: item.name || "",
              name: parsed.cleanName,
              price: parsed.price,
              url: item.webViewLink || ("https://drive.google.com/file/d/" + item.id + "/view"),
              folder: current.name,
              isFolder: isFolder,
              isImage: mime.indexOf("image/") === 0,
              thumb: item.thumbnailLink ? item.thumbnailLink.replace("=s220", "=s400") : ("https://lh3.googleusercontent.com/d/" + item.id + "=w400")
            });
          });
          pageToken = data.nextPageToken || "";
        } while (pageToken);
      }
      fullArchiveIndex = allItems;
      return allItems;
    }

    async function doSearch() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      if (!query) return;
      isSearching = true;
      scrollToTop();
      updateBackButton();
      document.getElementById("loader").style.display = "block";
      document.getElementById("loader").textContent = "Ricerca in tutto l'archivio...";
      document.getElementById("content").innerHTML = "";
      document.getElementById("breadcrumb").textContent = '🔍 "' + query + '"';

      try {
        const index = await buildFullIndex();
        const terms = query.split(/\s+/);
        const matches = index.filter(function(item) {
          const hay = (item.rawName + " " + item.name + " " + item.price).toLowerCase();
          return terms.every(function(t) { return hay.indexOf(t) !== -1; });
        });
        document.getElementById("loader").textContent = "Caricamento archivio in corso...";
        renderSearch(matches);
      } catch (err) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("content").innerHTML = '<div class="error-msg">Errore durante la ricerca: ' + escapeHtml(err.message) + '</div>';
      }
    }

    function renderSearch(results) {
      document.getElementById("loader").style.display = "none";
      if (results.length === 0) {
        document.getElementById("content").innerHTML = '<p>Nessun file o cartella trovato con questo nome.</p>';
        return;
      }
      const folders = results.filter(function(r) { return r.isFolder; });
      const files = results.filter(function(r) { return !r.isFolder; });

      let html = '<div class="section-title">Trovati ' + results.length + ' elementi</div>';
      if (folders.length > 0) {
        html += '<div class="grid" style="margin-bottom:14px;">';
        folders.forEach(function(item) {
          html += '<div class="card folder-card" data-fid="' + escapeHtml(item.id) + '" onclick="loadFolder(this.dataset.fid, true)">📁 <div><div>' + escapeHtml(item.name) + '</div><div class="folder-badge">in: ' + escapeHtml(item.folder) + '</div></div></div>';
        });
        html += '</div>';
      }
      if (files.length > 0) {
        html += '<div class="grid" id="filesGrid"></div><div class="load-more-wrap" id="loadMoreWrap"></div>';
      }

      document.getElementById("content").innerHTML = html;
      currentFileList = files;
      renderedCount = 0;
      if (currentFileList.length > 0) appendMoreFiles();
    }
  </script>
</body>
</html>
